name: 🐉 新車龍龍 — 雲端自動重建、5層全站健檢與免費部署

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # 每日台灣時間 08:30 (00:30 UTC) 自動重建最新台灣新車目錄、匯率與 0 利率方案
    - cron: "30 0 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-catalog]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: 雲端抓取最新車款 → 5層零容錯全站實測 (含真 Chrome E2E)
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得最新程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 3.13（零外部套件相依，100% 標準函式庫）
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 3. 雲端即時抓取台灣全品牌現行新車 + 23 款貿易商限定新車並建置靜態網站
        run: python3 build_car_site.py --out dist

      - name: 4. 強制執行 5 層全站零容錯健檢（含真 Chrome E2E 模擬 GitHub Pages 子路徑）
        run: python3 audit_site.py --dir dist

      - name: 5. 設定 GitHub Pages 並打包通過驗證的靜態網站
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 6. 上傳靜態網站產物（僅在 5 層健檢 100% 通過後執行）
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 發布至永久免費 GitHub Pages（＋選配同步個人 GAS）
    if: github.event_name != 'pull_request'
    needs: build-and-audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署最新靜態網站至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: （選配 Tier 2）若已設定 GAS_SCRIPT_ID 與 CLASPRC_JSON，自動同步 gas/Code.gs 至個人 GAS
        uses: actions/checkout@v4
      - name: 檢查並自動 clasp push（未設定金鑰時自動略過）
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -n "$GAS_SCRIPT_ID" ] && [ -n "$CLASPRC_JSON" ] && [ -f "gas/Code.gs" ]; then
            echo "$CLASPRC_JSON" > ~/.clasprc.json
            printf '{"scriptId":"%s","rootDir":"gas"}\n' "$GAS_SCRIPT_ID" > .clasp.json
            [ -f "gas/appsscript.json" ] || printf '{"timeZone":"Asia/Taipei","exceptionLogging":"STACKDRIVER","runtimeVersion":"V8","webapp":{"executeAs":"USER_DEPLOYING","access":"MYSELF"}}\n' > gas/appsscript.json
            npx --yes @google/clasp push --force
            echo "✅ 已自動將最新 gas/Code.gs 與 gas/Index.html 推送至個人 GAS！"
          else
            echo "ℹ️ 未設定 GAS clasp Secrets，略過自動同步（手動將 Code.gs＋Index.html 貼至 GAS 同樣完全運作）。"
          fi
